name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test tools
        run: python -m pip install -e ".[dev,images]"
      - name: Compile source and tests
        run: python -m compileall -q src tests
      - name: Parse local Windows resource harness without executing it
        shell: pwsh
        run: |
          $source = Get-Content scripts/measure_windows_resource.ps1 -Raw
          [void][scriptblock]::Create($source)
      - name: Check imports and undefined names
        run: ruff check --select E4,E7,E9,F821 src tests
      - name: Run tests
        run: python -m pytest -q
